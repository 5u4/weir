<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(() => {
  const key = "weir.proto.theme";
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const pref = () => { const p = localStorage.getItem(key); return p === "light" || p === "dark" ? p : "system"; };
  const apply = () => { const p = pref(); document.documentElement.dataset.theme = p === "system" ? (mq.matches ? "dark" : "light") : p; };
  apply();
  mq.addEventListener("change", () => pref() === "system" && apply());
})();
</script>
<title>weir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<main id="app"></main>
<div class="cap" role="region" aria-label="weir 状态">
  <nav class="cap-nav" aria-label="分类"></nav>
  <div class="cap-toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
<script src="/ui/switch.js" defer></script>
</body>
</html>
