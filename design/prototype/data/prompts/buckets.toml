# Bucket order here is display order.
[action]
name = "要我处理"
rule = "A human or system needs me to reply, decide, pay, or act; direct questions addressed to me; deadlines I own."

[fyi]
name = "值得知道"
rule = "Human-written or meaningful updates related to me, where no action is needed from me."

[feed]
name = "订阅阅读"
rule = "Newsletters, articles, and digests worth skimming."

[notify]
name = "通知"
rule = "Automated notices: receipts, verification codes, CI, account alerts, marketing."
